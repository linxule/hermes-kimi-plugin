name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC — catches drift if upstream Hermes Agent removes
    # or renames a symbol this plugin depends on. Without the schedule the
    # only signal would be the next push.
    - cron: "0 6 * * *"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is intentionally excluded: hermes-agent declares
        # `requires-python = ">=3.11"` in its pyproject, so a 3.10 leg fails
        # at the install step with "Package 'hermes-agent' requires a
        # different Python: 3.10.x not in '>=3.11'". Mirror that floor here.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hermes-agent (upstream main)
        # We install from upstream main so this CI doubles as a kill-switch
        # for upstream drift: if a future commit on NousResearch/hermes-agent
        # removes/renames a symbol this plugin depends on, the schedule run
        # at 06:00 UTC surfaces the breakage as a CI failure rather than a
        # silent production issue.
        #
        # Floor for the plugin's public contract is hermes-agent >= 0.13.0
        # (apply_yaml_config_fn registry hook, shipped 2026-05-13 in 3633c8690;
        # ctx.register_platform shipped 2026-04-11 in 2e20f6ae2 / v0.11.0).
        # See pyproject.toml.
        run: |
          pip install 'hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@main'

      - name: Install plugin dev deps
        # The wheel is intentionally metadata-only (see pyproject.toml).
        # This installs pytest / pytest-asyncio / pyyaml — the plugin code
        # itself runs from the repo root via conftest.py's sys.path insert.
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke-test plugin discovery + register handshake
        # Replicates the Hermes plugin loader's directory-module setup exactly
        # (see hermes_cli/plugins.py::_load_directory_module). Confirms that
        # register() can be invoked against the installed hermes-agent without
        # raising, that it calls ctx.register_platform with the expected kwargs,
        # and that the relative imports inside kimi/__init__.py resolve under
        # the hermes_plugins.<name> namespace.  Catches gaps the unit suite
        # can't (the unit suite exercises the adapter; this exercises the
        # loader handshake against the installed hermes-agent).
        run: |
          python - <<'EOF'
          import sys
          import types
          import importlib.util

          _NS_PARENT = 'hermes_plugins'

          # Ensure the namespace parent package exists in sys.modules. Without
          # this, relative imports inside the plugin raise ModuleNotFoundError
          # because the parent package isn't findable.
          if _NS_PARENT not in sys.modules:
              ns_pkg = types.ModuleType(_NS_PARENT)
              ns_pkg.__path__ = []
              ns_pkg.__package__ = _NS_PARENT
              sys.modules[_NS_PARENT] = ns_pkg

          module_name = f'{_NS_PARENT}.kimi'
          spec = importlib.util.spec_from_file_location(
              module_name,
              'kimi/__init__.py',
              submodule_search_locations=['kimi'],
          )
          mod = importlib.util.module_from_spec(spec)
          mod.__package__ = module_name
          mod.__path__ = ['kimi']
          sys.modules[module_name] = mod
          spec.loader.exec_module(mod)

          # Stub PluginContext that records the register_platform call shape.
          recorded = {}
          class StubCtx:
              def register_platform(self, **kwargs):
                  recorded.update(kwargs)

          mod.register(StubCtx())

          # The plugin must request the canonical Kimi registration shape.
          assert recorded.get('name') == 'kimi', f"name: {recorded.get('name')!r}"
          assert recorded.get('label') == 'Kimi', f"label: {recorded.get('label')!r}"
          assert recorded.get('allowed_users_env') == 'KIMI_ALLOWED_USERS'
          assert recorded.get('allow_all_env') == 'KIMI_ALLOW_ALL_USERS'
          assert recorded.get('cron_deliver_env_var') == 'KIMI_HOME_CHANNEL'
          assert recorded.get('required_env') == ['KIMI_BOT_TOKEN']
          assert callable(recorded.get('adapter_factory'))
          assert callable(recorded.get('check_fn'))
          assert callable(recorded.get('apply_yaml_config_fn'))
          assert callable(recorded.get('env_enablement_fn'))

          # Verify the adapter_factory actually constructs a KimiAdapter
          # against a minimal PlatformConfig — catches constructor regressions.
          from gateway.config import PlatformConfig
          adapter = recorded['adapter_factory'](
              PlatformConfig(enabled=True, token='km_b_prod_SMOKE', extra={})
          )
          assert adapter.__class__.__name__ == 'KimiAdapter', (
              f"adapter type: {adapter.__class__.__name__}"
          )

          print('smoke ok: register() called ctx.register_platform with the expected shape')
          EOF
